<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>coingecko demo</title>
  </head>
  <body>
    <div class="main-container">
      <div class="nav-bar">
        <div class="left-top-nav">
          <img id="logo" src="Images/logo.png" />
          <h1>coingecko</h1>
        </div>
        <div id="counter">
          <span class="counter-text"></span>
        </div>
        <input id="search-coin" type="text" placeholder="Search..." />
      </div>
      <div class="heading">
        <h1>Top 10 Live Crypto Market</h1>
      </div>
      <div class="toggle">
        <h4>Change Currency</h4>
        <button class="currency-button">EUR</button>
      </div>
      <div class="coin-modal" id="coin-modal">
        <button class="coin-modal-close-btn" id="coin-modal-close-btn">
          X
        </button>
        <div id="coin-modal-inner"></div>
      </div>
      <div id="filter-coins">
        <div class="col" data-sort="market_cap_rank">▴ #</div>
        <div class="col" data-sort="name">
          Coin<span class="sort-arrow">▾</span>
        </div>
        <div class="col" data-sort="current_price">
          <span class="sort-arrow">▾</span>Price
        </div>
        <div class="col" data-sort="price_change_percentage_1h_in_currency">
          <span class="sort-arrow">▾</span> 1h
        </div>
        <div class="col" data-sort="price_change_percentage_24h">
          <span class="sort-arrow">▾</span>24h
        </div>
        <div class="col" data-sort="price_change_percentage_7d_in_currency">
          <span class="sort-arrow">▾</span>7d
        </div>
        <div class="col" data-sort="total_volume">
          <span class="sort-arrow">▾</span> 24h Volume
        </div>
        <div class="col" data-sort="market_cap">
          <span class="sort-arrow">▾</span> Market Cap
        </div>
      </div>
      <div id="coin-lists"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
